<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 200 200">
  <!-- Outer and inner hexagons, both regular and pointy-top, sharing a
       center.  The even-odd fill turns the pair into a ring of even
       thickness, which is 25 units of the 200-unit height. -->
