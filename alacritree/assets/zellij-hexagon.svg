     fill="#000000"
     fill-rule="evenodd"
     d="M 100,0 186.603,50 186.603,150 100,200 13.397,150 13.397,50 Z
        M 100,28.868 161.603,64.434 161.603,135.566 100,171.132 38.397,135.566 38.397,64.434 Z" />
</svg>
