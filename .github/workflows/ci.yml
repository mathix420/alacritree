name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  alacritree:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # eframe (winit + glow), arboard (X11/Wayland clipboard), and the unix
      # fontconfig dep all need C headers that aren't on the runner by default.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libfreetype6-dev libfontconfig1-dev \
            libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Rust toolchain
        run: rustup show && rustup component add clippy

      - name: Build
        run: cargo build -p alacritree --locked

      - name: Test
        run: cargo test -p alacritree --locked

      # --no-deps keeps clippy on our own crate. The vendored alacritty_terminal
      # is #![deny(clippy::all)], so a newer toolchain that adds a lint (e.g.
      # question_mark) turns it into a hard error we can't fix without editing a
      # read-only dependency. Linting the fork's code, not upstream's, is what we
      # want anyway.
      #
      # disallowed_methods is denied on its own rather than through -D warnings:
      # it is the backstop for a process wait written inline in a UI handler, and
      # a lint that only warns lets one ship. Every other lint stays a warning so
      # unrelated code does not fail the build.
      - name: Clippy
        run: cargo clippy -p alacritree --all-targets --locked --no-deps -- -D clippy::disallowed_methods

      # Pinned: the audit parses ast-grep's JSON, and an upgrade that moves that
      # format would leave it inspecting nothing. The script exits 2 on an empty
      # scan rather than reporting a clean one, so a stale pin is loud.
      - name: ast-grep
        run: npm install -g @ast-grep/cli@0.45.1

      # The `jobs::Blocking` token is a compile-time gate, but `on_this_thread`
      # is public by design, so a handler can still hand itself a token. This is
      # what catches that. The script reads source text and does not evaluate
      # cfg, so one platform covers every target's code.
      - name: UI-thread audit
        run: python3 alacritree/tools/ui-thread-audit.py .

  # Compile the platform-specific process and notification integrations before
  # a release tag reaches cargo-dist.  Branch pushes with an open PR already
  # receive the pull_request run, so only run direct pushes for master.
  alacritree-macos:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: brew install cmake pkg-config fontconfig freetype

      - name: Rust toolchain
        run: rustup show && rustup component add clippy

      # Clippy rather than a plain check, for the same reason as the Windows
      # job: the macOS arms of links.rs and session.rs are lint-visible nowhere
      # else. --all-targets covers session.rs's macOS-only test, which the
      # check this replaces never compiled.
      - name: Clippy
        run: cargo clippy -p alacritree --all-targets --locked --no-deps -- -D clippy::disallowed_methods

  # Clipboard file/image fallbacks and WSL path handling are primarily
  # Windows-facing. Compile and run their pure tests before those cfg branches
  # reach a release tag.
  alacritree-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6

      - name: Rust toolchain
        run: rustup show && rustup component add clippy

      # Clippy in place of a plain check: it compiles the same cfg branches and
      # is the only run that lints them. Most of the crate's process spawning
      # lives behind #[cfg(windows)] — wsl.rs, wsl_helper.rs, the Windows arm of
      # links.rs — which a Linux-only lint never sees.
      - name: Clippy
        run: cargo clippy -p alacritree --all-targets --locked --no-deps -- -D clippy::disallowed_methods

      - name: Test
        run: cargo test -p alacritree --locked
