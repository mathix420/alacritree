[package]
name = "alacritree_gh"
version = "0.0.0"
license = "Apache-2.0"
description = "Looks up a branch's GitHub pull request through the gh CLI"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
alacritree_common.workspace = true
alacritree_forge.workspace = true
git2 = { version = "0.20", default-features = false }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
