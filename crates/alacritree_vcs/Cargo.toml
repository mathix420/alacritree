[package]
name = "alacritree_vcs"
version = "0.0.0"
license = "Apache-2.0"
description = "What alacritree asks of a repository, whichever version control keeps it"
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
# The scripted backend, for other crates' tests of code that drives one.
test-support = []

[dependencies]
alacritree_common.workspace = true
ambassador.workspace = true
strum = { version = "0.26", features = ["derive"] }
thiserror.workspace = true
