[workspace]
members = [
    "alacritree",
    "alacritty",
    "alacritty_terminal",
    "alacritty_config",
    "alacritty_config_derive",
    # Not `crates/*`: release-please's cargo-workspace plugin globs files too,
    # and would take crates/clippy.toml for a crate.
    "crates/alacritree_*",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"

[profile.release]
lto = "thin"
debug = 1
incremental = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
alacritree_checkout_hooks = { path = "crates/alacritree_checkout_hooks" }
alacritree_common = { path = "crates/alacritree_common" }
alacritree_diff_viewer = { path = "crates/alacritree_diff_viewer" }
alacritree_doppler = { path = "crates/alacritree_doppler" }
alacritree_forge = { path = "crates/alacritree_forge" }
alacritree_gh = { path = "crates/alacritree_gh" }
alacritree_herdr = { path = "crates/alacritree_herdr" }
alacritree_multiplexer = { path = "crates/alacritree_multiplexer" }
alacritree_zellij = { path = "crates/alacritree_zellij" }
ambassador = "0.5.1"
thiserror = "2"
toml = "0.9.11"
toml_edit = "0.24.0"

# TODO: Validation of fix for #6978. Remove before next release and use released `x11-clipboard`.
[patch.crates-io]
x11-clipboard = { git = "https://github.com/quininer/x11-clipboard.git", rev = "19ab2163cf0bd0db607e827a5214571990307866" }
# Vendored egui-winit with a one-liner so Ctrl+V falls through to a Key event
# when the clipboard isn't text (e.g. holds an image), matching alacritty's
# raw 0x16 forwarding and letting TUIs like Claude Code do their own wl-paste.
egui-winit = { path = "egui-winit" }
